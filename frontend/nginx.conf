server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing -- unknown paths fall back to index.html so react-router
    # can handle them client-side instead of nginx 404ing on e.g. /sessions/abc.
    location / {
        try_files $uri /index.html;
    }

    # Same /api prefix-stripping proxy as the Vite dev server (vite.config.ts),
    # so the frontend code doesn't need to know whether it's running in dev
    # or behind this container -- "backend" resolves via Docker Compose's
    # internal DNS, not localhost.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE (chat/stream) needs buffering off and a long read timeout --
        # otherwise nginx buffers the whole response before forwarding it,
        # which defeats streaming, or cuts the connection during a slow
        # multi-step agent run.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
